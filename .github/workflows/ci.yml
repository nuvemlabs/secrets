name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s bash -S warning secrets.sh backends/*.sh bin/secrets-doctor install.sh tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install a Secret Service (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libsecret-tools gnome-keyring dbus
      - name: Write the test runner
        run: |
          cat > "$RUNNER_TEMP/run-tests.sh" <<'SCRIPT'
          if command -v gnome-keyring-daemon >/dev/null; then
            # Throwaway keyring on this private session bus, unlocked with a dummy password
            export XDG_DATA_HOME="$(mktemp -d)"
            printf 'ci' | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          fi
          failed=0
          for t in tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
          SCRIPT
      - name: Test suites (Linux, private D-Bus session)
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash "$RUNNER_TEMP/run-tests.sh"
      - name: Test suites (macOS)
        if: runner.os == 'macOS'
        run: bash "$RUNNER_TEMP/run-tests.sh"
